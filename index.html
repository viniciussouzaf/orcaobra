<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ORÇAOBRA</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div id="app">

        <header class="topbar">
            <div>
                <h1>ORÇAOBRA</h1>
                <span>Sistema de Orçamentos e Custos</span>
            </div>

            <button id="menuButton">☰</button>
        </header>

        <main>

            <section class="welcome">
                <h2>Olá, Fernando! 👋</h2>
                <p>Vamos preparar seu próximo orçamento.</p>
            </section>

            <section class="quick-actions">

                <button class="action primary">
                    <strong>＋</strong>
                    <span>Novo Orçamento</span>
                </button>

                <button class="action">
                    <strong>👥</strong>
                    <span>Clientes</span>
                </button>

                <button class="action">
                    <strong>🧱</strong>
                    <span>Materiais</span>
                </button>

                <button class="action">
                    <strong>🛠️</strong>
                    <span>Serviços</span>
                </button>

            </section>

            <section class="dashboard">

                <div class="card">
                    <span>Orçamentos</span>
                    <strong>0</strong>
                </div>

                <div class="card">
                    <span>Obras em andamento</span>
                    <strong>0</strong>
                </div>

                <div class="card">
                    <span>Valor orçado</span>
                    <strong>R$ 0,00</strong>
                </div>

                <div class="card">
                    <span>Lucro previsto</span>
                    <strong>R$ 0,00</strong>
                </div>

            </section>

            <section class="section">

                <div class="section-header">
                    <h2>Últimos orçamentos</h2>

                    <button>Ver todos</button>
                </div>

                <div class="empty">

                    <div class="empty-icon">
                        📋
                    </div>

                    <h3>Nenhum orçamento ainda</h3>

                    <p>
                        Crie seu primeiro orçamento para começar.
                    </p>

                </div>

            </section>

        </main>

        <nav class="bottom-nav">

            <button class="active">
                <span>⌂</span>
                <small>Início</small>
            </button>

            <button>
                <span>📄</span>
                <small>Orçamentos</small>
            </button>

            <button>
                <span>🏗️</span>
                <small>Obras</small>
            </button>

            <button>
                <span>⚙️</span>
                <small>Mais</small>
            </button>

        </nav>

    </div>

    <script src="js/app.js"></script>

</body>
</html>
